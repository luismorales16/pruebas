<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Infinity Sports</title>
<meta name="description" content="Tu centro deportivo personal: fútbol, motor, baloncesto y más en un solo lugar.">
<meta name="theme-color" content="#0c0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14;
  --surface:#151a22;
  --surface-2:#1c222c;
  --line:#272f3b;
  --text:#eef1f5;
  --muted:#8f9aab;
  --accent:#4d7cff;
  --accent-ink:#ffffff;
  --live:#ff4157;
  --gap:16px;
  --radius:14px;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(12,15,20,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.62rem;color:var(--muted);letter-spacing:.14em;margin-top:-4px}
.tabs{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--text);background:var(--surface)}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.search{margin-left:auto;position:relative;flex:0 1 280px}
.search input{width:100%;height:40px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px 0 42px;color:var(--text);font:inherit;font-size:.92rem}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(900px 420px at 85% -10%,rgba(77,124,255,.38),transparent 60%),
  radial-gradient(600px 400px at 0% 110%,rgba(255,65,87,.18),transparent 60%),
  var(--bg)}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:56px 0 64px}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.82rem;color:var(--text);background:rgba(255,65,87,.14);border:1px solid rgba(255,65,87,.4);padding:5px 12px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,65,87,.7)}100%{box-shadow:0 0 0 10px rgba(255,65,87,0)}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,8vw,6.2rem);line-height:.92;letter-spacing:-.005em;margin:18px 0 16px;text-transform:uppercase}
.hero p{color:var(--muted);font-size:1.08rem;max-width:46ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:.98rem;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:hover{background:#6a92ff}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--line)}
.btn svg{width:18px;height:18px}

.stage{position:relative;aspect-ratio:16/11;border-radius:22px;border:1px solid var(--line);background:linear-gradient(150deg,#1b2a55 0%,#101733 55%,#0c0f14 100%);overflow:hidden;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 64px)}
.stage{padding:12px}
.stage svg.sports{position:relative;width:100%;height:100%;display:block}
.stage-tag{position:absolute;left:18px;bottom:16px;right:18px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.stage-tag b{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1}
.stage-tag span{font-size:.82rem;color:var(--muted)}

/* ---------- secciones ---------- */
main{padding-bottom:40px}
.cat{padding-top:44px}
.cat-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.cat-head h2{font-family:var(--display);font-weight:800;font-size:2.1rem;text-transform:uppercase;letter-spacing:.01em}
.cat-head span{color:var(--muted);font-size:.9rem}
.rail-block{margin-top:22px}
.rail-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.rail-top h3{font-size:1.08rem;font-weight:700}
.rail-top p{color:var(--muted);font-size:.86rem}
.arrows{display:flex;gap:6px}
.arrow{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:background .2s}
.arrow:hover{background:var(--surface-2)}
.arrow svg{width:16px;height:16px}
.rail{display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.comp{flex:none;width:200px;border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff}
.comp b{font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.comp small{font-weight:600;font-size:.82rem;opacity:.85}
.comp.has-img img{width:100%;max-height:74px;object-fit:contain;object-position:left center;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.comp::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;border:18px solid rgba(255,255,255,.12)}

.card{flex:none;width:210px;min-height:132px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 16px 22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;scroll-snap-align:start;position:relative;transition:transform .18s,border-color .18s,background .18s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ac,var(--accent))}
.card:hover{transform:translateY(-3px);border-color:var(--ac,var(--accent));background:var(--surface-2)}
.card .name{font-weight:700;font-size:.98rem;line-height:1.25;padding-right:26px}
.card .meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.hd{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(77,124,255,.18);color:#9db6ff}
.sd{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted)}
.play{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;color:var(--text)}
.play svg{width:30px;height:30px;padding:8px;border-radius:50%;background:var(--accent);color:#fff;transition:scale .18s}
.card:hover .play svg{scale:1.12}
.card .play svg{background:var(--ac,var(--accent))}
.fav{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.fav:hover{background:var(--line);color:var(--text)}
.fav svg{width:17px;height:17px}
.fav[aria-pressed="true"]{color:#ffc933}
.fav[aria-pressed="true"] svg{fill:currentColor}

.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.86rem}
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,translate .25s;z-index:100;max-width:calc(100% - 32px)}
.toast.on{opacity:1;translate:-50% 0}

@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding:36px 0 44px;gap:28px}
  .stage{aspect-ratio:16/9}
  .top-in{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px 14px}
  .search{order:3;flex:1 1 100%;margin-left:0}
  .tabs{margin-left:0;order:2;flex:1 1 100%}
  html{scroll-padding-top:150px}
  .arrows{display:none}
}
@media (max-width:480px){
  .comp{width:170px}.card{width:182px}
  .cat-head h2{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<script>
/* ============================================================

   Pega el enlace de cada canal en el campo "u" (entre comillas).
   Si "u" está vacío, el botón avisa de que falta el enlace.

    { name:"LaLiga Hypermotion", sub:"Segunda División Española", mono:"Liga Hyper-motion", grad:"linear-gradient(135deg,#2ec4b6,#0b6e75)", ch: ch(
      "LaLiga TV Hypermotion HD","LaLiga TV Hypermotion") },
    { name:"Champions League", sub:"Fútbol europeo", mono:"Champions", grad:"linear-gradient(135deg,#4d7cff,#1b2a8a)", ch: ch(
      "M+ Liga de Campeones HD","M+ Liga de Campeones","M+ Liga de Campeones 2 HD","M+ Liga de Campeones 2",
      "M+ Liga de Campeones 3 HD","M+ Liga de Campeones 3","M+ Liga de Campeones 4 HD","M+ Liga de Campeones 4",
      "M+ Liga de Campeones 5","M+ Liga de Campeones 6") },
    { name:"Primera Federación", sub:"Primera Federación Española", mono:"1ª Fede-ración", grad:"linear-gradient(135deg,#7bb369,#2f6b3a)", ch: ch(
      "Primera Federación HD","Primera Federación") }
  ]},
  { id:"motor", label:"Motor", comps:[
    { name:"Fórmula 1", sub:"Campeonato mundial de Fórmula 1", mono:"Formula 1", grad:"linear-gradient(135deg,#ff5a36,#9b1c1c)", ch: ch("DAZN F1 HD","DAZN F1") },
    { name:"MotoGP", sub:"Campeonato mundial de motociclismo", mono:"MotoGP", grad:"linear-gradient(135deg,#ff9f1c,#b24a00)", ch: ch("DAZN MotoGP HD","DAZN MotoGP") }
  ]},
  { id:"baloncesto", label:"Baloncesto", comps:[
    { name:"Baloncesto", sub:"Canales especializados en baloncesto", mono:"Balon-cesto", grad:"linear-gradient(135deg,#f77f00,#a63d00)", ch: ch("DAZN Baloncesto","DAZN Baloncesto 2") }
  ]},
  { id:"deportes", label:"Deportes", comps:[
    { name:"DAZN", sub:"Canales deportivos DAZN", mono:"DAZN", grad:"linear-gradient(135deg,#3a4150,#171b23)", ch: ch("DAZN 1","DAZN 2","DAZN 3","DAZN 4") },
    { name:"Eurosport", sub:"Deportes internacionales", mono:"Euro-sport", grad:"linear-gradient(135deg,#2b6cb0,#14305a)", ch: ch("Eurosport 1","Eurosport 2") },
    { name:"M+ Deportes", sub:"Canales deportivos Movistar", mono:"Deportes", grad:"linear-gradient(135deg,#00a6d6,#00587a)", ch: ch(
      "M+ Deportes","M+ Deportes 2","M+ Deportes 3","M+ Deportes 4","M+ Deportes 5","M+ Deportes 6","M+ Vamos") },
    { name:"Golf", sub:"Canal especializado en golf", mono:"Golf", grad:"linear-gradient(135deg,#43aa8b,#1d5e4a)", ch: ch("M+ Golf") }

// cada canal hereda el color de su competición (el primer color de su degradado)
CATS.forEach(cat => cat.comps.forEach(comp => {
  const col = (comp.grad.match(/#[0-9a-fA-F]{6}/) || ["#4d7cff"])[0];
  comp.ch.forEach(c => { c.color = col; });
}));

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const toastEl = $("#toast");
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove("on"), 2600); }
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("mis-favs") || "[]")); } catch(e){}
function saveFavs(){ try { localStorage.setItem("mis-favs", JSON.stringify([...favs])); } catch(e){} }

function openChannel(c){
  if (c.u) window.open(c.u, "_blank", "noopener");
  else toast("Este canal aún no tiene enlace.");
}

const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.500v13l11-6.500z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.800 5.700 6.200.9-4.500 4.400 1.100 6.200L12 17.200 6.400 20.200l1.100-6.200L3 9.600l6.200-.9z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'
};

/* ---------- render ---------- */
let activeCat = "todo";
let query = "";
const main = $("#main");

function cardEl(c, compName){
  const card = document.createElement("div");
  card.className = "card";
  if (c.color) card.style.setProperty("--ac", c.color);
  const key = c.n;
  const isHD = /\bHD$/.test(c.n);
  card.innerHTML = `
    <div class="name">${c.n}</div>
    <div class="meta">
      <span class="${isHD ? "hd" : "sd"}">${isHD ? "HD" : "SD"}</span>
      <span class="play">${ICON.play}Ver</span>
    </div>`;
  card.setAttribute("role","button");
  card.tabIndex = 0;
  card.setAttribute("aria-label", "Ver " + c.n);
  card.addEventListener("click", () => openChannel(c));
  card.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openChannel(c); } });
  const fav = document.createElement("button");
  fav.className = "fav";
  fav.innerHTML = ICON.star;
  fav.setAttribute("aria-label", "Marcar " + c.n + " como favorito");
  fav.setAttribute("aria-pressed", favs.has(key));
  fav.addEventListener("click", e => {
    e.stopPropagation();
    favs.has(key) ? favs.delete(key) : favs.add(key);
    saveFavs(); render();
  });
  fav.addEventListener("keydown", e => e.stopPropagation());
  card.appendChild(fav);
  return card;
}

function railBlock(title, sub, channels, comp){
  const block = document.createElement("div");
  block.className = "rail-block";
  block.innerHTML = `<div class="rail-top"><div><h3>${title}</h3><p>${sub}</p></div>
    <div class="arrows"><button class="arrow" aria-label="Anterior">${ICON.prev}</button><button class="arrow" aria-label="Siguiente">${ICON.next}</button></div></div>`;
  const rail = document.createElement("div");
  rail.className = "rail";
  if (comp){
    const t = document.createElement("div");
    t.className = "comp";
    t.style.background = comp.grad;
    const count = `<small>${channels.length} ${channels.length===1?"canal":"canales"}</small>`;
    if (comp.img){
      t.classList.add("has-img");
      t.innerHTML = `<img src="${comp.img}" alt="${comp.name}" loading="lazy">${count}`;
    } else {
      t.innerHTML = `<b>${comp.mono.replace("-","<br>")}</b>${count}`;
    }
    rail.appendChild(t);
  }
  channels.forEach(c => rail.appendChild(cardEl(c)));
  const [bp, bn] = block.querySelectorAll(".arrow");
  bp.onclick = () => rail.scrollBy({left:-rail.clientWidth*.8, behavior:"smooth"});
  bn.onclick = () => rail.scrollBy({left: rail.clientWidth*.8, behavior:"smooth"});
  block.appendChild(rail);
  return block;
}

function render(){
  main.innerHTML = "";
  const q = norm(query.trim());
  let shown = 0;

  // favoritos
  const allCh = CATS.flatMap(c => c.comps.flatMap(k => k.ch));
  const favCh = allCh.filter(c => favs.has(c.n));
  if (favCh.length && !q && activeCat === "todo"){
    const s = document.createElement("section");
    s.className = "cat";
    s.id = "favoritos";
    s.innerHTML = `<div class="cat-head"><h2>Mis favoritos</h2><span>${favCh.length} ${favCh.length===1?"canal":"canales"}</span></div>`;
    s.appendChild(railBlock("Acceso rápido", "Los canales que has marcado con la estrella", favCh));
    main.appendChild(s); shown++;
  }

  CATS.forEach(cat => {
    if (activeCat !== "todo" && activeCat !== cat.id) return;
    const sec = document.createElement("section");
    sec.className = "cat";
    sec.id = cat.id;
    let count = 0;
    const blocks = [];
    cat.comps.forEach(comp => {
      const compMatch = q && norm(comp.name + " " + comp.sub).includes(q);
      const list = q ? comp.ch.filter(c => compMatch || norm(c.n).includes(q)) : comp.ch;
      if (!list.length) return;
      count += list.length;
      blocks.push(railBlock(comp.name, comp.sub, list, comp));
    });
    if (!blocks.length) return;
    sec.innerHTML = `<div class="cat-head"><h2>${cat.label}</h2><span>${count} ${count===1?"canal":"canales"}</span></div>`;
    blocks.forEach(b => sec.appendChild(b));
    main.appendChild(sec); shown++;
  });

  if (!shown){
    main.innerHTML = `<div class="empty"><b>No hay canales para "${query.replace(/</g,"&lt;")}"</b>Prueba con otro nombre o borra la búsqueda.</div>`;
  }
}

/* ---------- pestañas ---------- */
const tabs = $("#tabs");
[{id:"todo",label:"Todo"}, ...CATS.map(c => ({id:c.id,label:c.label}))].forEach(t => {
  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = t.label;
  b.setAttribute("aria-pressed", t.id === activeCat);
  b.addEventListener("click", () => {
    activeCat = t.id;
    tabs.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
    window.scrollTo({top: $("#inicio").offsetHeight - 40, behavior:"smooth"});
  });
  tabs.appendChild(b);
});

$("#q").addEventListener("input", e => { query = e.target.value; render(); });

render();
</script>
</body>
